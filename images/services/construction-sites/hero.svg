<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Techniciens africains sur un chantier de construction telecom</title>
  <desc id="d">Deux techniciens a peau noire portant casques et gilets de securite devant un pylone telecom et une grue.</desc>
  <defs>
