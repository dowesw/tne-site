<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Telephonie IP en entreprise</title>
  <desc id="d">Une agente africaine a peau noire communique sur un poste telephonique IP connecte au cloud VoIP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#070c1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#1e8c3a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1e8c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>
  <circle cx="1080" cy="380" r="160" fill="#2ecc71" opacity="0.05"/>

  <!-- sol -->
  <rect x="0" y="408" width="1200" height="72" fill="#0a1128"/>
  <rect x="0" y="408" width="1200" height="3" fill="#1e8c3a" opacity="0.5"/>

  <!-- cloud VoIP -->
  <g>
    <path d="M880 130 a38 38 0 0 1 38 -38 a46 46 0 0 1 44 30 a34 34 0 0 1 30 34 a30 30 0 0 1 -30 30 l-82 0 a26 26 0 0 1 0 -56 Z"
          fill="#16223f" stroke="#2a3550" stroke-width="4" transform="translate(60,-20)"/>
    <g transform="translate(918,88) scale(1.5)" fill="none" stroke="#2ecc71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </g>
    <text x="1000" y="170" font-family="monospace" font-size="15" font-weight="bold" fill="#2ecc71" text-anchor="middle">VoIP</text>
  </g>
  <path d="M520 300 C 680 260, 800 220, 930 170" fill="none" stroke="#2ecc71" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- bureau -->
  <rect x="120" y="340" width="480" height="14" rx="6" fill="#2a3550"/>
  <rect x="150" y="354" width="12" height="54" fill="#1a2440"/>
  <rect x="560" y="354" width="12" height="54" fill="#1a2440"/>

  <!-- ordinateur portable -->
  <rect x="150" y="276" width="76" height="48" rx="4" fill="#0a1128" stroke="#3d4b63" stroke-width="3"/>
  <rect x="144" y="324" width="88" height="10" rx="4" fill="#3d4b63"/>
  <circle cx="170" cy="294" r="8" fill="#1e8c3a"/>
  <path d="M166 294 l3 3 l6 -6" stroke="#e8edf5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="186" y="288" width="30" height="5" rx="2.5" fill="#16223f"/>
  <rect x="160" y="308" width="56" height="5" rx="2.5" fill="#16223f"/>

  <!-- poste telephonique IP -->
  <g>
    <rect x="400" y="300" width="120" height="44" rx="8" fill="#16223f" stroke="#3d4b63" stroke-width="3"/>
    <rect x="412" y="308" width="42" height="26" rx="3" fill="#0a1128"/>
    <rect x="416" y="313" width="24" height="4" rx="2" fill="#2ecc71"/>
    <rect x="416" y="321" width="34" height="4" rx="2" fill="#1a2440"/>
    <circle cx="472" cy="314" r="3.5" fill="#2ecc71"/>
    <circle cx="486" cy="314" r="3.5" fill="#3d4b63"/>
    <circle cx="500" cy="314" r="3.5" fill="#3d4b63"/>
    <circle cx="472" cy="328" r="3.5" fill="#3d4b63"/>
    <circle cx="486" cy="328" r="3.5" fill="#3d4b63"/>
    <circle cx="500" cy="328" r="3.5" fill="#f39c12"/>
    <!-- combine pose -->
    <rect x="382" y="294" width="18" height="52" rx="9" fill="#0d1630" stroke="#3d4b63" stroke-width="2"/>
  </g>

  <!-- ondes d'appel -->
  <g fill="none" stroke="#2ecc71" stroke-linecap="round">
    <path d="M540 290 a18 18 0 0 1 0 26" stroke-width="4"/>
    <path d="M554 278 a32 32 0 0 1 0 50" stroke-width="4" opacity="0.55"/>
    <path d="M568 266 a46 46 0 0 1 0 74" stroke-width="4" opacity="0.3"/>
  </g>

  <!-- agente au telephone -->
  <ellipse cx="760" cy="412" rx="70" ry="9" fill="#000" opacity="0.35"/>
  <rect x="736" y="326" width="18" height="66" fill="#1c2742"/>
  <rect x="766" y="326" width="18" height="66" fill="#1c2742"/>
  <rect x="732" y="388" width="26" height="14" rx="5" fill="#0e1526"/>
  <rect x="762" y="388" width="26" height="14" rx="5" fill="#0e1526"/>
  <rect x="728" y="238" width="64" height="94" rx="16" fill="#16a085"/>
  <!-- bras qui tient le combine a l'oreille -->
  <line x1="786" y1="252" x2="812" y2="200" stroke="#117a65" stroke-width="15" stroke-linecap="round"/>
  <circle cx="813" cy="196" r="8" fill="#8d5524"/>
  <rect x="800" y="164" width="17" height="40" rx="8" fill="#141414" transform="rotate(18 808 184)"/>
  <line x1="732" y1="252" x2="706" y2="308" stroke="#117a65" stroke-width="15" stroke-linecap="round"/>
  <circle cx="704" cy="312" r="8" fill="#8d5524"/>
  <rect x="750" y="222" width="20" height="18" fill="#6b4226"/>
  <ellipse cx="760" cy="196" rx="29" ry="33" fill="#8d5524"/>
  <circle cx="760" cy="170" r="26" fill="#141414"/>
  <ellipse cx="760" cy="182" rx="29" ry="26" fill="#8d5524"/>
  <path d="M731 178 a29 26 0 0 1 58 0 l0 -6 q-29 -20 -58 0 Z" fill="#141414"/>
  <circle cx="734" cy="168" r="11" fill="#141414"/>
  <circle cx="751" cy="188" r="2.6" fill="#141414"/>
  <circle cx="769" cy="188" r="2.6" fill="#141414"/>
  <path d="M752 200 Q760 206 768 200" stroke="#3d2410" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- bulle qualite HD -->
  <g transform="translate(920,250)">
    <ellipse rx="76" ry="42" fill="#16223f" stroke="#2ecc71" stroke-width="3"/>
    <polygon points="-30,38 -44,62 -12,42" fill="#16223f" stroke="#2ecc71" stroke-width="3" stroke-linejoin="round"/>
    <text y="-4" font-family="monospace" font-size="17" font-weight="bold" fill="#e8edf5" text-anchor="middle">Appel HD</text>
    <g stroke="#2ecc71" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-24 14 h10 l6 -12 l8 22 l6 -10 h14"/>
    </g>
  </g>
</svg>
