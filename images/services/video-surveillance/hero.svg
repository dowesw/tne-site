<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Installation de video surveillance IP</title>
  <desc id="d">Un technicien africain a peau noire installe une camera de surveillance pendant qu'un mur d'ecrans affiche les flux CCTV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#070c1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#1e8c3a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1e8c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>
  <circle cx="1120" cy="110" r="130" fill="#2ecc71" opacity="0.05"/>

  <!-- sol -->
  <rect x="0" y="408" width="1200" height="72" fill="#0a1128"/>
  <rect x="0" y="408" width="1200" height="3" fill="#1e8c3a" opacity="0.5"/>

  <!-- mur d'ecrans CCTV -->
  <g>
    <rect x="60" y="60" width="250" height="140" rx="8" fill="#0a1128" stroke="#2a3550" stroke-width="4"/>
    <rect x="76" y="76" width="50" height="8" rx="4" fill="#16223f"/>
    <circle cx="292" cy="82" r="5" fill="#e74c3c"/>
    <polyline points="80,180 120,150 160,162 200,130 240,142 290,110" fill="none" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <rect x="80" y="100" width="34" height="22" rx="3" fill="none" stroke="#2ecc71" stroke-width="2"/>

    <rect x="330" y="60" width="250" height="140" rx="8" fill="#0a1128" stroke="#2a3550" stroke-width="4"/>
    <rect x="346" y="76" width="50" height="8" rx="4" fill="#16223f"/>
    <circle cx="562" cy="82" r="5" fill="#e74c3c"/>
    <rect x="380" y="130" width="40" height="24" rx="4" fill="#16223f"/>
    <rect x="386" y="118" width="28" height="16" rx="3" fill="#16223f"/>
    <circle cx="390" cy="158" r="6" fill="#0d1630"/>
    <circle cx="412" cy="158" r="6" fill="#0d1630"/>
    <line x1="346" y1="170" x2="566" y2="170" stroke="#16223f" stroke-width="4"/>
    <rect x="470" y="104" width="34" height="22" rx="3" fill="none" stroke="#f39c12" stroke-width="2"/>

    <rect x="60" y="216" width="250" height="140" rx="8" fill="#0a1128" stroke="#2a3550" stroke-width="4"/>
    <rect x="76" y="232" width="50" height="8" rx="4" fill="#16223f"/>
    <circle cx="292" cy="238" r="5" fill="#e74c3c"/>
    <g stroke="#16223f" stroke-width="4">
      <line x1="100" y1="340" x2="160" y2="250"/>
      <line x1="270" y1="340" x2="210" y2="250"/>
      <line x1="160" y1="250" x2="210" y2="250"/>
    </g>
    <circle cx="185" cy="286" r="10" fill="none" stroke="#2ecc71" stroke-width="2.5"/>
    <line x1="185" y1="296" x2="185" y2="322" stroke="#2ecc71" stroke-width="2.5"/>
    <line x1="172" y1="308" x2="198" y2="308" stroke="#2ecc71" stroke-width="2.5"/>

    <rect x="330" y="216" width="250" height="140" rx="8" fill="#0a1128" stroke="#2a3550" stroke-width="4"/>
    <rect x="346" y="232" width="50" height="8" rx="4" fill="#16223f"/>
    <circle cx="562" cy="238" r="5" fill="#e74c3c"/>
    <rect x="370" y="290" width="60" height="50" rx="4" fill="#16223f"/>
    <rect x="446" y="270" width="60" height="70" rx="4" fill="#16223f"/>
    <rect x="522" y="300" width="44" height="40" rx="4" fill="#16223f"/>
    <rect x="378" y="298" width="20" height="12" rx="2" fill="#f1c40f" opacity="0.6"/>
    <rect x="454" y="280" width="20" height="12" rx="2" fill="#2ecc71" opacity="0.6"/>
  </g>
  <rect x="150" y="356" width="340" height="12" rx="5" fill="#2a3550"/>

  <!-- champ de vision de la camera -->
  <polygon points="700,140 940,260 940,60" fill="rgba(46,204,113,0.07)" stroke="rgba(46,204,113,0.35)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- camera bullet installee -->
  <g transform="translate(640,110) rotate(18)">
    <rect x="-60" y="-8" width="34" height="16" rx="4" fill="#3d4b63"/>
    <rect x="-30" y="-16" width="90" height="32" rx="12" fill="#d5dbe5" stroke="#aab4c4" stroke-width="2"/>
    <rect x="-36" y="-20" width="36" height="8" rx="4" fill="#aab4c4"/>
    <circle cx="56" cy="0" r="14" fill="#141414"/>
    <circle cx="56" cy="0" r="6" fill="#2ecc71"/>
  </g>

  <!-- camera dome -->
  <g transform="translate(1020,330)">
    <rect x="-10" y="-46" width="20" height="14" fill="#3d4b63"/>
    <ellipse cx="0" cy="-32" rx="34" ry="8" fill="#3d4b63"/>
    <path d="M-34 -32 a34 30 0 0 0 68 0 Z" fill="#141414"/>
    <circle cx="0" cy="-14" r="8" fill="#0a1128" stroke="#2ecc71" stroke-width="2"/>
  </g>

  <!-- echelle -->
  <g stroke="#7f8c8d" stroke-width="7" stroke-linecap="round">
    <line x1="740" y1="408" x2="778" y2="190"/>
    <line x1="796" y1="408" x2="834" y2="190"/>
  </g>
  <g stroke="#7f8c8d" stroke-width="5" stroke-linecap="round">
    <line x1="749" y1="366" x2="805" y2="366"/>
    <line x1="757" y1="322" x2="813" y2="322"/>
    <line x1="765" y1="278" x2="821" y2="278"/>
    <line x1="773" y1="234" x2="829" y2="234"/>
  </g>

  <!-- technicien sur l'echelle -->
  <line x1="790" y1="330" x2="778" y2="366" stroke="#22304f" stroke-width="16" stroke-linecap="round"/>
  <line x1="812" y1="330" x2="816" y2="322" stroke="#22304f" stroke-width="16" stroke-linecap="round"/>
  <rect x="776" y="360" width="24" height="12" rx="5" fill="#0e1526"/>
  <rect x="802" y="316" width="24" height="12" rx="5" fill="#0e1526"/>
  <rect x="772" y="240" width="52" height="94" rx="14" fill="#e67e22"/>
  <rect x="772" y="270" width="52" height="9" fill="#f5f6fa" opacity="0.85"/>
  <line x1="778" y1="254" x2="712" y2="180" stroke="#d35400" stroke-width="14" stroke-linecap="round"/>
  <circle cx="709" cy="176" r="8" fill="#6b4226"/>
  <line x1="820" y1="254" x2="828" y2="230" stroke="#d35400" stroke-width="14" stroke-linecap="round"/>
  <circle cx="829" cy="226" r="8" fill="#6b4226"/>
  <rect x="788" y="224" width="18" height="16" fill="#52321a"/>
  <ellipse cx="798" cy="200" rx="26" ry="29" fill="#6b4226"/>
  <path d="M772 193 a26 23 0 0 1 52 0 Z" fill="#f1c40f"/>
  <rect x="767" y="189" width="62" height="8" rx="4" fill="#f1c40f"/>
  <circle cx="790" cy="202" r="2.4" fill="#141414"/>
  <circle cx="806" cy="202" r="2.4" fill="#141414"/>
  <path d="M791 212 Q798 217 805 212" stroke="#2e1c0c" stroke-width="2.3" fill="none" stroke-linecap="round"/>

  <!-- perceuse dans la main -->
  <g transform="translate(688,158) rotate(-30)">
    <rect x="0" y="0" width="30" height="16" rx="4" fill="#f39c12"/>
    <rect x="6" y="16" width="10" height="16" rx="3" fill="#d35400"/>
    <line x1="30" y1="8" x2="44" y2="8" stroke="#aab4c4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- temoin REC -->
  <g transform="translate(1120,60)">
    <circle r="7" fill="#e74c3c"/>
    <circle r="12" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
