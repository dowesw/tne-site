<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Geolocalisation GPS de flotte de vehicules</title>
  <desc id="d">Un manager africain a peau noire suit ses vehicules sur une carte GPS avec des vehicules geolocalises.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#070c1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#1e8c3a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1e8c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>
  <circle cx="100" cy="420" r="150" fill="#2ecc71" opacity="0.05"/>

  <!-- sol -->
  <rect x="0" y="408" width="1200" height="72" fill="#0a1128"/>
  <rect x="0" y="408" width="1200" height="3" fill="#1e8c3a" opacity="0.5"/>

  <!-- carte GPS -->
  <rect x="80" y="70" width="640" height="320" rx="14" fill="#0d1630" stroke="#2a3550" stroke-width="4"/>
  <g stroke="#16223f" stroke-width="10">
    <line x1="80" y1="170" x2="720" y2="150"/>
    <line x1="80" y1="280" x2="720" y2="300"/>
    <line x1="220" y1="70" x2="200" y2="390"/>
    <line x1="420" y1="70" x2="440" y2="390"/>
    <line x1="600" y1="70" x2="580" y2="390"/>
  </g>
  <path d="M120 330 C 220 300, 260 200, 380 210 S 560 130, 660 160" fill="none" stroke="#2ecc71" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>

  <!-- vehicules sur la carte -->
  <g transform="translate(180,300)">
    <rect x="-26" y="-14" width="52" height="26" rx="7" fill="#3498db"/>
    <rect x="-8" y="-24" width="24" height="14" rx="4" fill="#3498db"/>
    <rect x="-5" y="-21" width="18" height="8" rx="2" fill="#0a1128"/>
    <circle cx="-14" cy="14" r="7" fill="#0a1128"/>
    <circle cx="16" cy="14" r="7" fill="#0a1128"/>
  </g>
  <g transform="translate(480,196)">
    <rect x="-26" y="-14" width="52" height="26" rx="7" fill="#e67e22"/>
    <rect x="-8" y="-24" width="24" height="14" rx="4" fill="#e67e22"/>
    <rect x="-5" y="-21" width="18" height="8" rx="2" fill="#0a1128"/>
    <circle cx="-14" cy="14" r="7" fill="#0a1128"/>
    <circle cx="16" cy="14" r="7" fill="#0a1128"/>
  </g>

  <!-- marqueurs de position -->
  <g transform="translate(660,150)">
    <circle r="26" fill="rgba(46,204,113,0.18)"/>
    <path d="M0 -18 c-11 0 -18 8 -18 17 c0 12 18 27 18 27 s18 -15 18 -27 c0 -9 -7 -17 -18 -17 Z" fill="#2ecc71"/>
    <circle cy="-2" r="7" fill="#0a1128"/>
  </g>
  <g transform="translate(140,116)">
    <path d="M0 -14 c-9 0 -14 6 -14 13 c0 9 14 21 14 21 s14 -12 14 -21 c0 -7 -5 -13 -14 -13 Z" fill="#f39c12"/>
    <circle cy="-2" r="5" fill="#0a1128"/>
  </g>
  <g transform="translate(330,340)">
    <path d="M0 -14 c-9 0 -14 6 -14 13 c0 9 14 21 14 21 s14 -12 14 -21 c0 -7 -5 -13 -14 -13 Z" fill="#e74c3c"/>
    <circle cy="-2" r="5" fill="#0a1128"/>
  </g>

  <!-- manager avec tablette -->
  <ellipse cx="890" cy="412" rx="70" ry="9" fill="#000" opacity="0.35"/>
  <rect x="866" y="326" width="18" height="66" fill="#1c2742"/>
  <rect x="896" y="326" width="18" height="66" fill="#1c2742"/>
  <rect x="862" y="388" width="26" height="14" rx="5" fill="#0e1526"/>
  <rect x="892" y="388" width="26" height="14" rx="5" fill="#0e1526"/>
  <rect x="858" y="238" width="64" height="94" rx="16" fill="#16a085"/>
  <line x1="862" y1="252" x2="838" y2="306" stroke="#117a65" stroke-width="15" stroke-linecap="round"/>
  <circle cx="836" cy="310" r="8" fill="#6b4226"/>
  <line x1="918" y1="252" x2="952" y2="286" stroke="#117a65" stroke-width="15" stroke-linecap="round"/>
  <circle cx="954" cy="288" r="8" fill="#6b4226"/>
  <line x1="862" y1="262" x2="836" y2="290" stroke="#117a65" stroke-width="15" stroke-linecap="round"/>
  <!-- tablette tenue a deux mains -->
  <rect x="790" y="252" width="64" height="46" rx="6" fill="#0a1128" stroke="#3d4b63" stroke-width="3" transform="rotate(-8 822 275)"/>
  <path d="M800 282 q14 -10 26 -2 q10 6 18 -4" fill="none" stroke="#2ecc71" stroke-width="3" transform="rotate(-8 822 275)"/>
  <circle cx="812" cy="266" r="4" fill="#2ecc71" transform="rotate(-8 822 275)"/>
  <rect x="880" y="222" width="20" height="18" fill="#52321a"/>
  <ellipse cx="890" cy="196" rx="29" ry="33" fill="#6b4226"/>
  <path d="M861 192 a29 30 0 0 1 58 0 l0 -8 q-29 -22 -58 0 Z" fill="#141414"/>
  <rect x="858" y="188" width="64" height="10" rx="5" fill="#1e8c3a"/>
  <circle cx="881" cy="198" r="2.6" fill="#141414"/>
  <circle cx="899" cy="198" r="2.6" fill="#141414"/>
  <path d="M882 210 Q890 216 898 210" stroke="#2e1c0c" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- panneau statistiques -->
  <rect x="990" y="90" width="150" height="180" rx="12" fill="#0d1630" stroke="#2a3550" stroke-width="3"/>
  <rect x="1006" y="108" width="70" height="9" rx="4.5" fill="#2ecc71"/>
  <text x="1006" y="146" font-family="monospace" font-size="24" font-weight="bold" fill="#e8edf5">24</text>
  <rect x="1006" y="156" width="90" height="7" rx="3.5" fill="#3d4b63"/>
  <rect x="1006" y="186" width="118" height="8" rx="4" fill="#16223f"/>
  <rect x="1006" y="186" width="86" height="8" rx="4" fill="#2ecc71"/>
  <rect x="1006" y="208" width="118" height="8" rx="4" fill="#16223f"/>
  <rect x="1006" y="208" width="60" height="8" rx="4" fill="#f39c12"/>
  <rect x="1006" y="230" width="118" height="8" rx="4" fill="#16223f"/>
  <rect x="1006" y="230" width="100" height="8" rx="4" fill="#3498db"/>
  <circle cx="1120" cy="120" r="6" fill="#2ecc71"/>
</svg>
