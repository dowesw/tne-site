  <rect x="655" y="178" width="32" height="22" rx="3" fill="#0a1128"/>
  <path d="M661 189 l6 6 l11 -12" stroke="#2ecc71" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="686" cy="176" r="3" fill="#2ecc71"/>
  <g fill="none" stroke="#4a5b7d" stroke-width="2.5" stroke-linecap="round">
