  <line x1="860" y1="110" x2="980" y2="390" stroke="#ffffff" stroke-width="5" opacity="0.04"/>
  <rect x="1050" y="240" width="14" height="44" rx="7" fill="#3d4b63"/>
  <rect x="748" y="90" width="12" height="318" fill="#16223f"/>
  <rect x="1080" y="90" width="12" height="318" fill="#16223f"/>

