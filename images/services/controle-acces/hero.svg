<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Controle d'acces biometrique en entreprise</title>
  <desc id="d">Un professionnel africain a peau noire badge devant un lecteur de controle d'acces pres d'une porte vitree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#070c1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#1e8c3a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1e8c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>
  <circle cx="120" cy="100" r="130" fill="#2ecc71" opacity="0.05"/>
  <circle cx="1100" cy="420" r="150" fill="#2ecc71" opacity="0.05"/>

  <!-- sol -->
