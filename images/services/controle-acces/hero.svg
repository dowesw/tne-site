  <path d="M474 210 Q482 216 490 210" stroke="#3d2410" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- empreinte digitale decorative -->
  <g transform="translate(1080,330)" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" opacity="0.8">
